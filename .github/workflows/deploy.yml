# Build the Astro site and upload dist/ to shared hosting over FTPS.
# Runs on every push to main (including commits made by Sveltia CMS) and manually.
# Setup: docs/deploy.md
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two uploads at the same time; a newer push cancels a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # design/ (~75 MB of Figma references) isn't needed to build the site.
          sparse-checkout: |
            /*
            !/design/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Astro keeps optimized images in node_modules/.astro; restoring it skips
      # re-encoding every photo on each run (only new/changed images are processed).
      - name: Cache optimized images
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('package-lock.json', 'astro.config.mjs', 'src/assets/**', 'src/content/**/*.jpg', 'src/content/**/*.png') }}
          restore-keys: astro-assets-

      - name: Build (astro check + astro build + prune unused assets)
        run: npm run build
        env:
          # Repository variables. Test domain: SITE_URL=https://nature-of-lights.cc716168.tw1.ru, NOINDEX=true.
          # Production: SITE_URL=https://prirodasveta.ru (or unset), NOINDEX=false (or unset).
          SITE_URL: ${{ vars.SITE_URL || 'https://prirodasveta.ru' }}
          NOINDEX: ${{ vars.NOINDEX || 'false' }}

      # Nothing is uploaded until the repository variable DEPLOY_ENABLED is "true"
      # (Settings → Secrets and variables → Actions → Variables).
      # DEPLOY_METHOD picks the transport: "rsync" (SSH, recommended) or "ftp" (default).

      # rsync over SSH: one compressed connection, only changed files are sent,
      # files removed from the build are deleted on the server.
      # Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS (optional), SSH_PORT (optional),
      # DEPLOY_PATH (site root relative to the SSH user's home, e.g. nature-of-lights/public_html/).
      - name: Upload to hosting (rsync over SSH)
        if: ${{ vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_METHOD == 'rsync' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          # Strip CR from keys pasted on Windows / via some editors.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Prints only the public fingerprint — compare with `ssh-keygen -lf <key>.pub` locally.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub; then
            echo "::error::SSH_PRIVATE_KEY is not a valid private key (paste the whole file incl. BEGIN/END lines, no passphrase)"
            exit 1
          fi
          echo "Deploy key: $(ssh-keygen -lf ~/.ssh/deploy_key.pub)"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          if ! ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "test -d '$DEPLOY_PATH'"; then
            echo "::error::SSH login failed or DEPLOY_PATH does not exist. Check that the public key above is in ~/.ssh/authorized_keys of SSH_USER on SSH_HOST."
            exit 1
          fi
          # --checksum: CI checkouts have fresh mtimes, so compare content instead.
          rsync -rlz --checksum --delete --stats \
            --chmod=D755,F644 \
            --exclude='/.ftp-deploy-sync-state.json' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"

      - name: Upload to hosting (FTP)
        if: ${{ vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_METHOD != 'rsync' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Repository variable FTP_PROTOCOL: ftps (explicit TLS) | ftp | ftps-legacy.
          # Timeweb shared hosting has no FTPS (AUTH TLS → "530 Please login with USER and PASS"), use ftp.
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          # e.g. /public_html/ or /www/prirodasveta.ru/ — must end with a slash
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Files matching these globs are neither uploaded nor deleted on the server.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
          log-level: standard
          timeout: 120000
