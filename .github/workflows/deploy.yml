# Build the Astro site and upload dist/ to shared hosting over FTPS.
# Runs on every push to main (including commits made by Sveltia CMS) and manually.
# Setup: docs/deploy.md
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two uploads at the same time; a newer push cancels a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # design/ (~75 MB of Figma references) isn't needed to build the site.
          sparse-checkout: |
            /*
            !/design/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (astro check + astro build)
        run: npm run build
        env:
          # Repository variables. Test domain: SITE_URL=https://nature-of-lights.cc716168.tw1.ru, NOINDEX=true.
          # Production: SITE_URL=https://prirodasveta.ru (or unset), NOINDEX=false (or unset).
          SITE_URL: ${{ vars.SITE_URL || 'https://prirodasveta.ru' }}
          NOINDEX: ${{ vars.NOINDEX || 'false' }}

      # Hosting isn't chosen yet: until the repository variable DEPLOY_ENABLED is
      # set to "true" (Settings → Secrets and variables → Actions → Variables),
      # pushes only build and check the site, so they don't fail on missing FTP secrets.
      - name: Upload to hosting (FTP)
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Repository variable FTP_PROTOCOL: ftps (explicit TLS) | ftp | ftps-legacy.
          # Timeweb shared hosting has no FTPS (AUTH TLS → "530 Please login with USER and PASS"), use ftp.
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          # e.g. /public_html/ or /www/prirodasveta.ru/ — must end with a slash
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Files matching these globs are neither uploaded nor deleted on the server.
          # api/config.php holds the real e-mail/Telegram secrets and is uploaded once by hand.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            api/config.php
          log-level: standard
          timeout: 120000

